name: Vision Inspector - capturas reales

on:
  push:
    branches: [AB-Vision-Inspector-v0.3]
    paths:
      - 'AB-Vision-Inspector-PORTABLE.html'
      - 'tools/capture_real_screenshots.py'
      - 'tools/extract_portable.py'
      - '.github/workflows/vision-screenshots.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capturas-reales:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Obtener rama de Vision
        uses: actions/checkout@v4
        with:
          ref: AB-Vision-Inspector-v0.3
          persist-credentials: true
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Preparar Chromium de pruebas
        run: |
          python -m pip install 'playwright>=1.55,<2'
          python -m playwright install --with-deps chromium
      - name: Extraer fuentes originales editables
        run: |
          python tools/extract_portable.py
          node --check src/vision-core.js
          node --check src/app.js
      - name: Inspección de demostración, auditoría y capturas
        run: python tools/capture_real_screenshots.py
      - name: Guardar capturas para auditoría
        uses: actions/upload-artifact@v4
        with:
          name: AB-Vision-Inspector-v0.3-capturas
          path: docs/screenshots/*.png
          if-no-files-found: error
      - name: Versionar capturas verificadas
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/screenshots/*.png index.html src/style.css src/vision-core.js src/app.js
          if ! git diff --cached --quiet; then
            git commit -m 'docs(vision): attach real Chromium screenshots and calibration audit'
            git push origin HEAD:AB-Vision-Inspector-v0.3
          fi
